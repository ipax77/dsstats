name: Release candidate

on:
  push:
    tags:
      - parser/v*
      - mydsstats/v*
      - service/v*
      - maui/v*
      - server/v*

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  validate:
    runs-on: windows-latest
    outputs:
      component: ${{ steps.tag.outputs.component }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - id: tag
        shell: pwsh
        run: |
          ./eng/Validate-Versions.ps1 -Tag $env:GITHUB_REF_NAME
          $parts = $env:GITHUB_REF_NAME.Split('/')
          "component=$($parts[0])" >> $env:GITHUB_OUTPUT
          "version=$($parts[1].Substring(1))" >> $env:GITHUB_OUTPUT
      - name: Validate all consumers for a parser release
        if: steps.tag.outputs.component == 'parser'
        run: dotnet test src/tests/dsstats.parser.tests/dsstats.parser.tests.csproj -c Release
      - name: Validate server release
        if: steps.tag.outputs.component == 'server'
        run: dotnet test src/tests/dsstats.tests/dsstats.tests.csproj -c Release

  package:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-release-${{ runner.os }}-${{ hashFiles('Directory.Build.props', 'global.json', 'src/**/*.csproj') }}
      - name: Build immutable artifact
        shell: pwsh
        run: ./eng/New-ReleaseArtifacts.ps1 -Component '${{ needs.validate.outputs.component }}' -Version '${{ needs.validate.outputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.validate.outputs.component }}-v${{ needs.validate.outputs.version }}
          path: artifacts/*
          if-no-files-found: error
      - name: Create or update draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = @(Get-ChildItem artifacts -File | ForEach-Object FullName)
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          }
          else {
            gh release create $tag @files --draft --verify-tag --generate-notes --title $tag
          }
