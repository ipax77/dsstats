name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  changes:
    runs-on: windows-latest
    outputs:
      parser: ${{ steps.filter.outputs.parser }}
      mydsstats: ${{ steps.filter.outputs.mydsstats }}
      service: ${{ steps.filter.outputs.service }}
      maui: ${{ steps.filter.outputs.maui }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./eng/Get-ChangedComponents.ps1 -BaseRef $env:BASE_SHA -GitHubOutput $env:GITHUB_OUTPUT

  validate-version:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PARSER_OUTPUT_IDENTICAL: ${{ contains(github.event.pull_request.labels.*.name, 'parser-output-identical') }}
        run: |
          $exempt = $env:PARSER_OUTPUT_IDENTICAL -eq 'true'
          ./eng/Validate-Versions.ps1 -BaseRef $env:BASE_SHA -ParserOutputIdentical:$exempt

  parser-tests:
    needs: changes
    if: needs.changes.outputs.parser == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Build.props', 'global.json', 'src/**/*.csproj') }}
      - run: dotnet restore src/tests/dsstats.parser.tests/dsstats.parser.tests.csproj
      - run: dotnet test src/tests/dsstats.parser.tests/dsstats.parser.tests.csproj --no-restore -c Release

  server-tests:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Build.props', 'global.json', 'src/**/*.csproj') }}
      - run: dotnet restore src/tests/dsstats.tests/dsstats.tests.csproj
      - run: dotnet restore src/server/dsstats.web/dsstats.web.csproj
      - run: dotnet test src/tests/dsstats.tests/dsstats.tests.csproj --no-restore -c Release
      - run: dotnet build src/server/dsstats.api/dsstats.api.csproj --no-restore -c Release
      - run: dotnet build src/server/dsstats.web/dsstats.web.csproj --no-restore -c Release

  mydsstats-build:
    needs: changes
    if: needs.changes.outputs.mydsstats == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Build.props', 'global.json', 'src/**/*.csproj') }}
      - run: dotnet restore src/mydsstats/dsstats.pwa/dsstats.pwa.csproj
      - run: dotnet build src/mydsstats/dsstats.pwa/dsstats.pwa.csproj --no-restore -c Release -p:RunAOTCompilation=false -p:WasmEnableMultiThreading=false

  service-build:
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Build.props', 'global.json', 'src/**/*.csproj') }}
      - run: dotnet restore src/service/service.slnx
      - run: dotnet build src/service/service.slnx --no-restore -c Release

  maui-build:
    needs: changes
    if: needs.changes.outputs.maui == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Build.props', 'global.json', 'src/**/*.csproj') }}
      - run: dotnet workload install maui-windows --skip-manifest-update
      - run: dotnet restore src/maui/dsstats.maui/dsstats.maui.csproj
      - run: dotnet build src/maui/dsstats.maui/dsstats.maui.csproj --no-restore -c Release -f net10.0-windows10.0.19041.0 -p:WindowsPackageType=None
